<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>이중 for문 흐름 실험실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
body{margin:0}
.titlebox{display:flex;flex-direction:column;gap:4px}
.home{font-size:.9rem;font-weight:700;color:var(--muted);text-decoration:none;align-self:flex-start;border-radius:6px;padding:.1em .3em;margin-left:-.3em}
.home:hover{color:var(--accent);background:var(--accent-soft)}
footer.credit{border-top:1px solid var(--line);padding-top:14px;margin-top:8px;text-align:center;color:var(--muted);font-size:.92rem}
footer.credit b{color:var(--ink)}
/* Layout: 학습지 예제 실행기 — 상단 탭, 코드 | 상태 | 흐름도 (python_lab과 같은 디자인) */
:root{
  --bg:#EEF2F7; --panel:#FFFFFF; --ink:#152033; --muted:#5A6579; --line:#D6DDE8; --line-strong:#9AA6B8;
  --accent:#2F6FEB; --accent-ink:#FFFFFF; --accent-soft:#E3ECFD;
  --code-bg:#18202F; --code-fg:#E4E8F0; --code-dim:#6F7B91; --code-hi:rgba(255,204,77,.22); --code-hibar:#FFCC4D;
  --t-kw:#8DB8FF; --t-str:#A9D48C; --t-com:#7D879B; --t-num:#F5B97A;
  --m-init:#4FA3FF; --m-cond:#C08BFF; --m-upd:#FF8A5B;
  --true:#16915F; --true-soft:#DDF5EA; --false:#D93A40; --false-soft:#FDE4E5;
  --font-d:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --font-b:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-m:"JetBrains Mono",ui-monospace,Consolas,"D2Coding",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141D; --panel:#171E2A; --ink:#E6EAF2; --muted:#9AA5B8; --line:#2A3445; --line-strong:#56637A;
  --accent:#6E9DFF; --accent-ink:#0F141D; --accent-soft:#1F2C47; --code-bg:#0B1018;
  --true:#3CCB8A; --true-soft:#143326; --false:#FF6B70; --false-soft:#3A1A1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141D; --panel:#171E2A; --ink:#E6EAF2; --muted:#9AA5B8; --line:#2A3445; --line-strong:#56637A;
  --accent:#6E9DFF; --accent-ink:#0F141D; --accent-soft:#1F2C47; --code-bg:#0B1018;
  --true:#3CCB8A; --true-soft:#143326; --false:#FF6B70; --false-soft:#3A1A1C; color-scheme:dark}
[hidden]{display:none!important}
html{font-size:17px}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:1rem;line-height:1.55}
.wrap{max-width:1500px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--font-d);font-weight:400;font-size:2.1rem;line-height:1.1;margin:0;text-wrap:balance}
h1 code{font-family:var(--font-m);font-size:.85em;color:var(--accent)}
.fontctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.exhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.exno{font-family:var(--font-d);font-size:1.7rem;line-height:1;background:var(--ink);color:var(--bg);border-radius:10px;padding:.25em .6em;white-space:nowrap}
.extitle{font-family:var(--font-d);font-size:1.5rem}
.exdesc{color:var(--muted);font-size:.95rem;flex-basis:100%;margin-top:-4px}
details.jump-menu{position:relative}
details.jump-menu summary{list-style:none;cursor:pointer;white-space:nowrap;font-weight:700;border:1px solid var(--accent);color:var(--accent);background:var(--panel);border-radius:8px;padding:.42em .9em}
details.jump-menu summary::-webkit-details-marker{display:none}
details.jump-menu[open] summary{background:var(--accent);color:var(--accent-ink)}
.jm-list{position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:min(330px,90vw);max-height:70vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.jm-list button{text-align:left;border:none;display:flex;gap:10px;align-items:center;font-size:1rem;white-space:nowrap}
.jm-list button b{font-family:var(--font-d);font-weight:400;font-size:1.1rem;min-width:5.2em}
.jm-list .sec{font-size:.75rem;color:var(--muted);font-weight:700;padding:6px 8px 0}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);padding:.42em .9em}
button:hover{background:var(--accent-soft)}
button:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.primary:hover{filter:brightness(1.08);background:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line)}
nav.tabs a{font-family:var(--font-d);font-size:1.2rem;padding:.4em 1em;color:var(--muted);text-decoration:none;border-radius:10px 10px 0 0;border:2px solid transparent;border-bottom:none;margin-bottom:-2px}
nav.tabs a[aria-selected="true"]{color:var(--ink);background:var(--panel);border-color:var(--line)}
.panel{display:flex;flex-direction:column;gap:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:.3em .9em;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label.tog{display:flex;align-items:center;gap:6px;font-size:.92rem;cursor:pointer}
details.opts summary{cursor:pointer;color:var(--muted);font-size:.9rem;padding:.4em .6em;list-style:none}
details.opts summary::before{content:"⚙ "}
.optbox{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:6px 4px;font-size:.9rem;color:var(--muted)}

.rgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,.85fr);gap:14px;align-items:start}
@media (max-width:1150px){.rgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.flowpane{grid-column:1/-1}}
@media (max-width:720px){.rgrid{grid-template-columns:minmax(0,1fr)}}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px}
.pane-h{font-size:.78rem;font-weight:700;letter-spacing:.08em;color:var(--muted)}

.code{background:var(--code-bg);color:var(--code-fg);border-radius:10px;padding:10px 0;font-family:var(--font-m);font-size:1.12rem;overflow-x:auto}
.ln{display:flex;white-space:pre;border-left:4px solid transparent;transition:background .2s;align-items:baseline}
.ln .no{width:2.6em;flex:none;text-align:right;padding-right:.9em;color:var(--code-dim);user-select:none}
.ln .tx{padding:.18em .6em .18em 0;flex:1}
.ln .hit{flex:none;font-size:.78rem;color:var(--code-dim);padding-right:.8em;font-weight:700;min-width:3.2em;text-align:right}
.ln .hit.up{color:var(--code-hibar)}
.ln.done{background:var(--code-hi);border-left-color:var(--code-hibar)}
.ln.err{background:rgba(255,107,112,.22);border-left-color:var(--false)}
.ln.blank .tx{color:var(--code-dim)}
.t-kw{color:var(--t-kw);font-weight:700}.t-str{color:var(--t-str)}.t-com{color:var(--t-com);font-style:italic}.t-num{color:var(--t-num)}
.ig{display:inline-block;border-left:2px solid rgba(255,255,255,.12)}
.ig.l0{border-left-color:color-mix(in srgb,var(--m-init) 70%,transparent)}
.ig.l1{border-left-color:color-mix(in srgb,var(--m-cond) 70%,transparent)}
.ig.l2{border-left-color:color-mix(in srgb,var(--m-upd) 70%,transparent)}
.colors-on .lv0{color:var(--m-init);font-weight:700}
.colors-on .lv1{color:var(--m-upd);font-weight:700}
.colors-on .lv2{color:var(--m-cond);font-weight:700}
.errbox{font-family:var(--font-m);font-size:.95rem;color:var(--false);background:var(--false-soft);border-radius:8px;padding:.5em .8em;white-space:pre-wrap;word-break:break-word}

.condcard{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.stepinfo{font-size:.82rem;color:var(--muted)}
.note{font-size:1.12rem;font-weight:500}
.note.muted{color:var(--muted)}
.note code{font-family:var(--font-m);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 .35em}
.banner{border-radius:8px;padding:.5em .8em;font-weight:500;font-size:.95rem}
.banner.ok{background:var(--true-soft);color:var(--true)}
.banner.bad{background:var(--false-soft);color:var(--false)}
.banner.done{background:var(--accent-soft);color:var(--ink)}

.loops{display:flex;flex-direction:column;gap:6px}
.loop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.92rem}
.loop .lname{font-weight:700;min-width:5.4em}
.loop .dots{display:flex;gap:4px;flex-wrap:wrap}
.loop .dot{width:1.5em;height:1.5em;border-radius:6px;border:2px solid var(--line-strong);font-family:var(--font-m);font-size:.72rem;display:grid;place-items:center;color:var(--muted)}
.loop .dot.past{background:var(--line);border-color:var(--line)}
.loop .dot.now{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.loop.lv0 .dot.now{border-color:var(--m-init)}
.loop.lv1 .dot.now{border-color:var(--m-upd)}

.vars{display:flex;flex-wrap:wrap;gap:10px}
.var{border:2px solid var(--line-strong);border-radius:10px;min-width:88px;padding:6px 12px 8px;display:flex;flex-direction:column;align-items:center;background:var(--panel)}
.var .vn{font-family:var(--font-m);font-size:.9rem;color:var(--muted)}
.var .vv{font-family:var(--font-m);font-size:2rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.var .vv.s{font-size:1.4rem}
.var.empty .vv{color:var(--line-strong)}
.var.changed{border-color:var(--accent)}
.var.changed .vv{animation:pop .35s ease}
.colors-on .var.lv0{border-color:var(--m-init)}
.colors-on .var.lv1{border-color:var(--m-upd)}
.var.list{align-items:flex-start;max-width:100%}
.cells{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.cell{display:flex;flex-direction:column;align-items:center;gap:2px}
.cell .box{min-width:2.6em;padding:.15em .4em;border:2px solid var(--line-strong);border-radius:6px;font-family:var(--font-m);font-weight:700;font-size:1.15rem;text-align:center;background:var(--bg);white-space:nowrap}
.cell .ix{font-family:var(--font-m);font-size:.72rem;color:var(--muted);line-height:1.15;text-align:center}
.cell .ix .neg{color:var(--false);opacity:.8}
.cell.r .box{border-color:var(--accent);background:var(--accent-soft)}
.cell.w .box{border-color:var(--m-upd);background:color-mix(in srgb,var(--m-upd) 20%,var(--panel));animation:pop .35s ease}
.cell.a .box{border-color:var(--true);background:var(--true-soft);animation:pop .35s ease}
.cell.s .box{border-color:var(--m-cond);background:color-mix(in srgb,var(--m-cond) 18%,var(--panel))}
@keyframes pop{0%{transform:scale(1.25)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.var.changed .vv,.cell .box{animation:none!important}}

.console{background:var(--code-bg);color:var(--code-fg);font-family:var(--font-m);border-radius:10px;padding:10px 12px;height:9em;overflow:auto;font-size:1rem;white-space:pre-wrap;word-break:break-all}
.console .newest{color:#FFFFFF;font-weight:700;background:rgba(255,204,77,.28);border-radius:3px}
.console .nl{color:var(--code-dim)}

svg.flow{width:100%;height:auto;max-width:420px;display:block;margin:0 auto}
svg.flow rect,svg.flow polygon.nd{fill:var(--panel);stroke:var(--line-strong);stroke-width:2;transition:fill .2s,stroke .2s}
svg.flow g.on rect,svg.flow g.on polygon.nd{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3.5}
svg.flow .fl-t{font-family:var(--font-m);font-size:12.5px;fill:var(--ink)}
svg.flow .fl-lab{font-family:var(--font-b);font-size:11px;fill:var(--muted)}
svg.flow path.ar{fill:none;stroke:var(--line-strong);stroke-width:2}
svg.flow path.ar.on{stroke:var(--accent);stroke-width:4}
svg.flow .ah{fill:var(--line-strong)}
svg.flow .lab-t{fill:var(--true);font-weight:700;font-size:12px;font-family:var(--font-m)}
svg.flow .lab-f{fill:var(--false);font-weight:700;font-size:12px;font-family:var(--font-m)}
svg.flow .lab-on{font-size:15px}
.flowscroll{overflow:auto;max-height:34em}

.predict{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.predict .ph{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.predict .ph b{font-family:var(--font-d);font-weight:400;font-size:1.3rem}
.predict .ph span{color:var(--muted);font-size:.92rem}
.predict textarea{font-family:var(--font-m);font-size:1rem;width:100%;box-sizing:border-box;min-height:5.5em;border:2px solid var(--line-strong);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px 10px;resize:vertical}
.cmp{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:2px 10px;font-family:var(--font-m);font-size:.95rem;align-items:center}
.cmp .h{font-family:var(--font-b);font-size:.78rem;color:var(--muted);font-weight:700}
.cmp .o{color:var(--true);font-weight:700}.cmp .x{color:var(--false);font-weight:700}
.cmp div{white-space:pre;overflow:hidden;text-overflow:ellipsis}

details.trace{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
details.trace summary{cursor:pointer;font-weight:700}
.tablewrap{overflow:auto;max-height:22em;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:.35em .6em;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);font-size:.8rem;color:var(--muted)}
td.m{font-family:var(--font-m)}
td.chg{color:var(--accent);font-weight:700}
tr.cur td{background:var(--accent-soft)}
tr{cursor:pointer}

.lead{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.lead b{color:var(--accent)}
.labgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.labgrid{grid-template-columns:minmax(0,1fr)}}
.lrow{display:flex;align-items:center;gap:6px;font-family:var(--font-m);font-size:1.1rem;white-space:pre}
.lrow .lno{color:var(--code-dim);width:1.6em;text-align:right;flex:none}
.lrow .ctl{display:flex;gap:4px;flex:none;width:9.4em;align-items:center}
.lrow .ctl button{padding:.1em .5em;font-size:.95rem}
.lrow .ctl .sp{font-family:var(--font-b);font-size:.8rem;color:var(--muted);width:3em;text-align:center}
.lrow .lcode{color:var(--code-fg)}
.lrow .dotsp{color:var(--code-dim)}
.labcode{background:var(--code-bg);border-radius:10px;padding:10px 8px;display:flex;flex-direction:column;gap:4px;overflow-x:auto}
.counts{display:flex;gap:10px;flex-wrap:wrap}
.cnt{border:2px solid var(--line-strong);border-radius:10px;padding:6px 14px;display:flex;flex-direction:column;align-items:center;min-width:5em}
.cnt b{font-family:var(--font-m);font-size:1.6rem}
.cnt span{font-size:.85rem;color:var(--muted)}
.mission{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.mission li{display:flex;gap:8px;align-items:baseline}
.mission li .ck{font-weight:700;color:var(--line-strong);width:1.2em}
.mission li.ok .ck{color:var(--true)}
.mission li.ok{color:var(--true)}
.ib{--c:var(--m-init);border:2px solid var(--c);border-left-width:8px;border-radius:10px;background:color-mix(in srgb,var(--c) 7%,var(--panel));padding:4px 6px 8px;display:flex;flex-direction:column;gap:4px}
.ib.lv1{--c:var(--m-upd)}
.ib.lv2{--c:var(--m-cond)}
.ib-h{font-family:var(--font-m);font-weight:700;padding:.2em .5em;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ib-tag{font-family:var(--font-b);font-size:.82rem;font-weight:500;background:color-mix(in srgb,var(--c) 22%,var(--panel));border-radius:999px;padding:.05em .7em}
.ib-b{display:flex;flex-direction:column;gap:4px;margin-left:clamp(10px,3vw,24px)}
.ib-s{font-family:var(--font-m);padding:.2em .5em;border-radius:6px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ib-s .times{font-family:var(--font-b);font-size:.82rem;color:var(--muted)}
.boxes{display:flex;flex-direction:column;gap:6px}

.locked{display:flex;flex-direction:column;align-items:flex-start;gap:10px;background:var(--panel);border:2px dashed var(--line-strong);border-radius:12px;padding:16px}
.lrow.errrow{background:rgba(255,107,112,.22);border-radius:6px}
.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.gate{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:820px){.gate{grid-template-columns:minmax(0,1fr)}}
.gateform{display:flex;flex-direction:column;gap:10px}
.gf{display:flex;flex-direction:column;gap:4px;font-weight:700}
.gf input,.gf textarea{font-family:var(--font-m);font-size:1.1rem;border:2px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--ink);padding:.35em .6em;box-sizing:border-box;width:100%}
.gmark{font-size:.85rem;font-weight:700;margin-left:.3em}
.gmark.ok{color:var(--true)}.gmark.bad{color:var(--false)}
.gf input.bad,.gf textarea.bad{border-color:var(--false)}
.blank{display:inline-block;min-width:1.6em;text-align:center;border:2px dashed var(--code-hibar);border-radius:6px;color:var(--code-hibar);font-weight:700;margin:0 .1em}
.theme-btn{white-space:nowrap}
.nocopy{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);font-weight:700;border-radius:10px;padding:.6em 1.1em;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100vw - 32px);text-align:center}
</style>

<script>
/*ENGINE-START*/
class PyErr extends Error{}
class Halt extends Error{}
const LIMIT = 900;

function stripComment(s){
  let q=null;
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(q){ if(c==='\\'){i++;continue;} if(c===q) q=null; }
    else if(c==="'"||c==='"') q=c;
    else if(c==='#') return s.slice(0,i);
  }
  return s;

const KW=new Set(['for','in','print','range','len','append']);
function hlLine(raw, loopVars){
  const ind=raw.match(/^ */)[0].length;
  let guides='';
  for(let k=0;k<Math.floor(ind/4);k++) guides+=`<span class="ig l${k}">    </span>`;
  guides+=' '.repeat(ind%4);
  const body=raw.slice(ind);
  const re=/(#.*$)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|(\b\d+\b)|([A-Za-z_가-힣][\w가-힣]*)|([^#'"\w가-힣]+)/g;
  let out='', m;
  while((m=re.exec(body))){
    if(m[1]) out+=`<span class="t-com">${esc(m[1])}</span>`;
    else if(m[2]) out+=`<span class="t-str">${esc(m[2])}</span>`;
    else if(m[3]) out+=`<span class="t-num">${m[3]}</span>`;
    else if(m[4]){ const w=m[4]; if(w in loopVars) out+=`<span class="lv${loopVars[w]}">${w}</span>`; else if(KW.has(w)) out+=`<span class="t-kw">${w}</span>`; else out+=esc(w); }
    else out+=esc(m[5]);
  }
  return guides+out;
}
function loopVarsOf(tree){ const r={}; (function w(ns){ for(const n of ns) if(n.k==='for'){ if(!(n.v in r)) r[n.v]=n.depth; w(n.body);} })(tree||[]); return r; }

/* ───────── 순서도 ───────── */
function buildFlow(tree){
  const BW=184, BH=34, HW=196, HH=40, GAP=22;
  const D=treeDepth(tree);
  const lane=d=>HW/2+16+(D-1-d)*16;
  const CX=Math.max(lane(0)+24, 130);
  const W=CX*2;
  const shapes=[], paths=[], labs=[];
  const short=t=>t.length>22?t.slice(0,21)+'…':t;
  function seq(nodes, y, from){
    for(const n of nodes){
      paths.push({d:`M${CX},${from} L${CX},${y}`, ah:[CX,y], to:n.line});
      if(n.k==='for'){
        shapes.push({line:n.line, kind:'for', x:CX-HW/2, y, w:HW, h:HH, text:`${n.v} in ${n.itText}`});
        const yb=seq(n.body, y+HH+GAP, y+HH);
        labs.push({x:CX+6, y:y+HH+14, t:'True', c:'lab-t', line:n.line, k:'iter'});
        const L=lane(n.depth);
        paths.push({d:`M${CX},${yb} L${CX},${yb+10} L${CX-L},${yb+10} L${CX-L},${y+HH/2} L${CX-HW/2},${y+HH/2}`, ah:[CX-HW/2,y+HH/2,'r'], back:n.line});
        paths.push({d:`M${CX+HW/2},${y+HH/2} L${CX+L},${y+HH/2} L${CX+L},${yb+26} L${CX},${yb+26}`, exit:n.line});
        labs.push({x:CX+HW/2+4, y:y+HH/2-6, t:'False', c:'lab-f', line:n.line, k:'exit'});
        from=yb+26; y=yb+26+GAP;
      } else {
        shapes.push({line:n.line, kind:'box', x:CX-BW/2, y, w:BW, h:BH, text:short(n.text)});
        from=y+BH; y=y+BH+GAP;
      }
    }
    return from;
  }
  const end=seq(tree, 14, 0);
  paths[0].d=paths[0].d.replace(`M${CX},0`,`M${CX},0`);
  const ey=end+GAP;
  paths.push({d:`M${CX},${end} L${CX},${ey}`, ah:[CX,ey]});
  shapes.push({line:'end', kind:'end', x:CX-60, y:ey, w:120, h:30, text:'끝'});
  const H=ey+44;
  let svg=`<svg class="flow" viewBox="0 0 ${W} ${H}" role="img" aria-label="순서도">`;
  paths.forEach((p,ix)=>{ if(ix===0) return; svg+=`<path class="ar" data-back="${p.back||''}" data-to="${p.to||''}" d="${p.d}"/>`; if(p.ah){ const [x,y,dir]=p.ah; svg+= dir==='r'?`<polygon class="ah" points="${x},${y} ${x-9},${y-5} ${x-9},${y+5}"/>`:`<polygon class="ah" points="${x},${y} ${x-5},${y-9} ${x+5},${y-9}"/>`; } });
  for(const s of shapes){
    if(s.kind==='for'){ const {x,y,w,h:hh}=s; svg+=`<g data-line="${s.line}"><polygon class="nd" points="${x+14},${y} ${x+w-14},${y} ${x+w},${y+hh/2} ${x+w-14},${y+hh} ${x+14},${y+hh} ${x},${y+hh/2}"/><text class="fl-t" x="${x+w/2}" y="${y+hh/2+4}" text-anchor="middle">${esc(s.text.length>24?s.text.slice(0,23)+'…':s.text)}</text></g>`; }
    else svg+=`<g data-line="${s.line}"><rect x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" rx="${s.kind==='end'?15:6}"/><text class="fl-t" x="${s.x+s.w/2}" y="${s.y+s.h/2+4}" text-anchor="middle">${esc(s.text)}</text></g>`;
  }
  for(const l of labs) svg+=`<text class="${l.c}" data-lab="${l.line}-${l.k}" x="${l.x}" y="${l.y}">${l.t}</text>`;
  svg+='</svg>';
  return svg;
}

      svg.querySelectorAll('path.ar').forEach(p=>p.classList.remove('on'));
      if(s.line&&s.kind!=='error'){ const p=svg.querySelector(`path.ar[data-to="${s.line}"]`); if(p&&s.kind!=='exit'&&(!prev||prev.line!==s.line)) p.classList.add('on'); }
      const on=svg.querySelector('g.on'); if(on&&this.el.flow.scrollHeight>this.el.flow.clientHeight){ const r=on.getBoundingClientRect(), c=this.el.flow.getBoundingClientRect(); if(r.top<c.top||r.bottom>c.bottom) this.el.flow.scrollTop+=r.top-c.top-c.height/3; }
    }
    this.drawTrace();
    if(this.opt.onStep) this.opt.onStep(s);
  }
  onEnd(){ if(this.el.ta && this.el.ta.value.trim()) this.compare(false); }
  compare(manual){
    const pred=(this.el.ta.value||'').replace(/\r/g,'');
    const s=this.steps[this.idx]; if(!s) return;
    if(!pred.trim()){ this.el.cmp.innerHTML=''; if(manual) toast('먼저 예측을 써 주세요'); return; }
    const norm=t=>t.split('\n').map(x=>x.replace(/\s+/g,' ').trim());
    let A=norm(s.out.replace(/\n$/,'')), P=norm(pred.replace(/\n+$/,''));
    const n=Math.max(A.length,P.length); let ok=0;
    const g=h('div',{class:'cmp'}, h('div',{class:'h'},''), h('div',{class:'h'},'내 예측'), h('div',{class:'h'},s.kind==='end'?'실제 출력':'지금까지 출력'));
    for(let i=0;i<n;i++){ const a=A[i]??'', p=P[i]??''; const same=a===p; if(same) ok++; g.append(h('div',{class:same?'o':'x'},same?'○':'✕'), h('div',{},p||' '), h('div',{},a||' ')); }
    this.el.cmp.innerHTML=''; this.el.cmp.append(g);
    const all=ok===n&&s.kind==='end';
    this.el.cmp.append(h('div',{class:'banner '+(all?'ok':(s.kind==='end'?'bad':'done'))}, all?`모두 맞혔어요! (${ok}/${n}줄)`:`${ok}/${n}줄 맞았어요.`+(s.kind==='end'?' 다른 줄은 단계별로 다시 따라가 보세요.':' 끝까지 실행하면 전체를 비교해요.')));
    if(all) toast('예측 성공! 🎉');
  }
}

/* ───────── 들여쓰기 실험실 ───────── */
const LAB={ lines:[ {t:"for i in range(2):",ind:0,fix:true}, {t:"for j in range(3):",ind:4,fix:true}, {t:"print('A')",ind:8}, {t:"print('B')",ind:4}, {t:"print('C')",ind:0} ] };
const MISSIONS=[
  {t:'B가 6번 출력되게 만들어 보세요', ok:r=>r.c&&r.c.B===6},
  {t:'C가 2번 출력되게 만들어 보세요', ok:r=>r.c&&r.c.C===2},
  {t:'A, B, C가 모두 6번씩 출력되게 만들어 보세요', ok:r=>r.c&&r.c.A===6&&r.c.B===6&&r.c.C===6},
  {t:'A는 6번, B와 C는 2번씩 출력되게 만들어 보세요', ok:r=>r.c&&r.c.A===6&&r.c.B===2&&r.c.C===2},
  {t:'IndentationError가 나게 만들어 보세요', ok:r=>r.err&&/IndentationError/.test(r.err)},
];
const labDone=new Set();
function labCode(){ return LAB.lines.map(l=>' '.repeat(l.ind)+l.t).join('\n'); }
function labResult(){
  const an=analyze(labCode());
  if(an.err) return {err:an.err.msg, line:an.err.line, an};
  const st=run(an.tree), out=st[st.length-1].out.split('\n').filter(Boolean);
  return {c:{A:out.filter(x=>x==='A').length,B:out.filter(x=>x==='B').length,C:out.filter(x=>x==='C').length}, an};
}
function renderLab(root){
  root.innerHTML='';
  root.append(h('div',{class:'exhead'}, h('span',{class:'exno'},'실험'), h('span',{class:'extitle'},'들여쓰기를 옮기면 실행 횟수가 바뀔까?'), h('div',{class:'exdesc'},'예제 2-3 코드예요. ◀ ▶로 print 줄의 들여쓰기를 0칸 · 4칸 · 8칸으로 옮겨 보고, 미션을 해결해 보세요.')));
  const grid=h('div',{class:'labgrid'});
  const left=h('section',{class:'pane'}), right=h('section',{class:'pane'});
  grid.append(left,right);
  const simRoot=h('div',{class:'panel'});
  root.append(grid, h('div',{class:'pane-h'},'↓ 지금 코드를 한 단계씩 실행해 보기'), simRoot);
  let sim=null;
  function draw(){
    const r=labResult();
    left.innerHTML='';
    left.append(h('div',{class:'pane-h'},'코드 (◀ ▶로 들여쓰기 옮기기)'));
    const lc=h('div',{class:'labcode nocopy'});
    LAB.lines.forEach((l,ix)=>{
      const ctl=h('span',{class:'ctl'});
      if(l.fix) ctl.append(h('span',{class:'sp'},`${l.ind}칸`));
      else ctl.append(
        h('button',{'aria-label':`${ix+1}번 줄 왼쪽으로`, disabled:l.ind===0, onclick:()=>{l.ind-=4; draw();}},'◀'),
        h('span',{class:'sp'},`${l.ind}칸`),
        h('button',{'aria-label':`${ix+1}번 줄 오른쪽으로`, disabled:l.ind>=12, onclick:()=>{l.ind+=4; draw();}},'▶'));
      lc.append(h('div',{class:'lrow'+(r.line===ix+1?' errrow':'')}, h('span',{class:'lno'},String(ix+1)), ctl,
        h('span',{class:'dotsp'},'·'.repeat(l.ind)), h('span',{class:'lcode',html:hlLine(l.t,{i:0,j:1})})));
    });
    left.append(lc);
    if(r.err) left.append(h('div',{class:'errbox'},`${r.line}번 줄 → ${r.err}`));
    else left.append(h('div',{class:'counts'}, ...['A','B','C'].map(k=>h('div',{class:'cnt'}, h('b',{},String(r.c[k])), h('span',{},`${k} 출력 횟수`)))));
    left.append(h('div',{class:'toolbar'}, h('button',{onclick:()=>{ LAB.lines[2].ind=8; LAB.lines[3].ind=4; LAB.lines[4].ind=0; draw(); }},'↺ 처음 코드로')));
    // 오른쪽: 상자 + 미션
    right.innerHTML='';
    right.append(h('div',{class:'pane-h'},'들여쓰기 = 상자'));
    if(r.err) right.append(h('div',{class:'note muted'},'오류가 있으면 상자를 만들 수 없어요.'));
    else right.append(boxView(r.an.tree));
    right.append(h('div',{class:'pane-h'},'미션'));
    const ul=h('ul',{class:'mission'});
    MISSIONS.forEach((m,ix)=>{ if(m.ok(r)) labDone.add(ix); ul.append(h('li',{class:labDone.has(ix)?'ok':''}, h('span',{class:'ck'},labDone.has(ix)?'✔':'○'), m.t)); });
    right.append(ul, h('div',{class:'stepinfo'},`해결한 미션 ${labDone.size} / ${MISSIONS.length}`));
    if(sim) sim.stop();
    sim=new Sim(simRoot,{no:'',title:'',code:labCode()},{key:'lab'});
    LAB.sim=sim;
  }
  draw();
}
function boxView(tree){
  const st=run(tree), hits=st[st.length-1].hits;
  function nodes(ns){
    const wrap=h('div',{class:'boxes'});
    for(const n of ns){
      if(n.k==='for'){
        const b=h('div',{class:'ib lv'+Math.min(n.depth,2)}, h('div',{class:'ib-h'}, h('span',{},n.text), h('span',{class:'ib-tag'},`${hits[n.line]||0}번 반복하는 상자`)));
        b.append(h('div',{class:'ib-b'}, nodes(n.body))); wrap.append(b);
      } else wrap.append(h('div',{class:'ib-s'}, h('span',{},n.text), h('span',{class:'times'},`→ ${hits[n.line]||0}번 실행`)));
    }
    return wrap;
  }
  return nodes(tree);
}

/* ───────── 문제 잠금: 내 답을 먼저 입력해야 열림 ───────── */
const digits=v=>{ const m=String(v).match(/-?\d+/); return m?m[0]:''; };
const nospace=v=>String(v).replace(/\s+/g,'');
const outLines=v=>String(v).replace(/\r/g,'').split('\n').map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
const ASK={
  q1:{blank:"a = [3, 6, 9, 12]\na.append(15)\nprint(len(a))\nprint(a[ ① ], a[ ② ])",
      fields:[{id:'b1',label:'빈칸 ①',ans:'1 (또는 -4)',ok:v=>['1','-4'].includes(digits(v))&&nospace(v).length<=3},
              {id:'b2',label:'빈칸 ②',ans:'-1 (또는 4)',ok:v=>['-1','4'].includes(digits(v))&&nospace(v).length<=3}]},
  q2:{fields:[{id:'out',label:'실행 결과',multi:true,ans:'3 4\n4 5',ok:v=>outLines(v).join('|')==='3 4|4 5'}]},
  q3:{fields:[{id:'n',label:'세트 수',ans:'6개',ok:v=>digits(v)==='6'},
              {id:'f',label:'첫 줄',ans:'떡볶이 콜라',ok:v=>nospace(v)==='떡볶이콜라'},
              {id:'l',label:'마지막 줄',ans:'김밥 물',ok:v=>nospace(v)==='김밥물'}]},
  q5:{fields:[{id:'ln',label:'몇 번째 줄을',ans:'3번째 줄',ok:v=>digits(v)==='3'},
              {id:'sp',label:'몇 칸으로 들여쓸까',ans:'8칸',ok:v=>digits(v)==='8'}]},
  q6:{blank:"# 1층부터 4층까지 별 계단 쌓기\n# 각 층에는 층 번호만큼 별을 출력\nfor i in range(1, 5):\n    for j in range( ① ):\n        print('*', ②='')\n    ③",
      fields:[{id:'b1',label:'빈칸 ①',ans:'i',ok:v=>nospace(v)==='i'},
              {id:'b2',label:'빈칸 ②',ans:'end',ok:v=>nospace(v)==='end'},
              {id:'b3',label:'빈칸 ③',ans:'print()',ok:v=>nospace(v)==='print()'}]},
};
G.answers={};
function gateView(sec,key){
  const ex=EX[key], A=ASK[key];
  const code=A.blank||ex.code;
  const codeEl=h('div',{class:'code nocopy'});
  code.split('\n').forEach((raw,ix)=>codeEl.append(h('div',{class:'ln'}, h('span',{class:'no'},String(ix+1)), h('span',{class:'tx',html:(hlLine(raw,{})||' ').replace(/[①②③]/g,m=>`<span class="blank">${m}</span>`)}))));
  const inputs={}, marks={};
  let tries=0;
  const form=h('form',{class:'gateform'});
  const fb=h('div',{class:'banner bad','aria-live':'polite',hidden:true});
  A.fields.forEach(f=>{
    const inp=f.multi?h('textarea',{id:`ans-${key}-${f.id}`,rows:3,spellcheck:'false',autocomplete:'off'}):h('input',{id:`ans-${key}-${f.id}`,type:'text',autocomplete:'off',spellcheck:'false'});
    inputs[f.id]=inp;
    const mark=h('span',{class:'gmark'});
    marks[f.id]=mark;
    inp.addEventListener('input',()=>{ mark.textContent=''; mark.className='gmark'; inp.classList.remove('bad'); });
    form.append(h('label',{class:'gf','for':`ans-${key}-${f.id}`}, h('span',{},f.label,' ',mark), inp));
  });
  const btn=h('button',{class:'primary',type:'submit',disabled:true},'답 제출하고 실행해 보기 ▶');
  const check=()=>{ btn.disabled=A.fields.some(f=>!inputs[f.id].value.trim()); };
  Object.values(inputs).forEach(i=>i.addEventListener('input',check));
  form.append(h('div',{class:'toolbar'},btn, h('span',{class:'stepinfo'},'모든 칸이 맞아야 실행 화면이 열려요')), fb);
  form.addEventListener('submit',e=>{
    e.preventDefault(); if(btn.disabled) return;
    tries++;
    const R=A.fields.map(f=>({label:f.label, v:inputs[f.id].value, ok:f.ok(inputs[f.id].value)}));
    R.forEach((r,ix)=>{ const f=A.fields[ix]; marks[f.id].textContent=r.ok?'○ 맞았어요':'✕ 다시 생각해 봐요'; marks[f.id].className='gmark '+(r.ok?'ok':'bad'); inputs[f.id].classList.toggle('bad',!r.ok); });
    if(R.every(r=>r.ok)){ G.answers[key]={tries}; G.unlocked[key]=true; toast('정답! 실행 화면이 열렸어요 🎉'); showEx(sec,key); return; }
    const bad=R.filter(r=>!r.ok).length;
    fb.hidden=false;
    fb.textContent=`${bad}칸이 아직 틀렸어요. ✕ 표시된 칸을 고쳐서 다시 제출해요. (${tries}번째 시도)`+(tries>=3?' 힌트: 코드를 한 줄씩 손으로 따라가 보세요!':'');
    const first=A.fields.find((f,ix)=>!R[ix].ok); if(first) inputs[first.id].focus();
  });
  return h('div',{class:'gate'},
    h('section',{class:'pane'}, h('div',{class:'pane-h'},'문제 코드'), codeEl),
    h('section',{class:'pane'}, h('div',{class:'pane-h'},'🔒 내 답 입력'), h('div',{class:'stepinfo'},'프린트에 쓴 내 답을 그대로 입력해요. 제출하면 맞았는지 알려 주고, 코드를 한 단계씩 실행해 볼 수 있어요.'), form));
}
function resultView(sec,key){
  const R=G.answers[key]; if(!R) return null;
  return h('section',{class:'predict'},
    h('div',{class:'ph'}, h('b',{},'🎉 정답!'), h('span',{},`${R.tries}번 만에 맞혔어요. 아래에서 한 단계씩 실행하며 왜 그런지 확인해 보세요.`)),
    h('div',{class:'toolbar'}, h('button',{onclick:()=>{ G.unlocked[key]=false; delete G.answers[key]; showEx(sec,key); }},'↺ 다시 풀기')));
  const n=R.filter(r=>r.ok).length, all=n===R.length;
  const grid=h('div',{class:'cmp'}, h('div',{class:'h'},''), h('div',{class:'h'},'내 답'), h('div',{class:'h'},'정답'));
  R.forEach(r=>grid.append(h('div',{class:r.ok?'o':'x'},r.ok?'○':'✕'), h('div',{},`${r.label}: ${r.v.trim().replace(/\n/g,' / ')}`), h('div',{},r.ok?'':r.ans.replace(/\n/g,' / '))));
  return h('section',{class:'predict'},
    h('div',{class:'ph'}, h('b',{},all?'🎉 모두 맞았어요!':`${n} / ${R.length} 맞았어요`), h('span',{},all?'아래에서 실행 과정을 확인해 보세요':'틀린 곳은 아래에서 한 단계씩 실행하며 이유를 찾아보세요')),
    grid, h('div',{class:'toolbar'}, h('button',{onclick:()=>{ G.unlocked[key]=false; delete G.answers[key]; showEx(sec,key); }},'↺ 다시 풀기')));
}

/* ───────── 화면 구성 ───────── */
let sims={};
function showEx(sec, key, flash){
  G.cur[sec]=key;
  const panel=$(`#panel-${sec}`);
  panel.innerHTML='';
  const S=SECTIONS.find(x=>x.id===sec);
  const chips=h('div',{class:'chips'}, ...S.exs.map(k=>h('button',{class:'chip','aria-pressed':String(k===key), onclick:()=>showEx(sec,k)}, `${EX[k].no} ${EX[k].title}`)));
  if(S.exs.length>1) panel.append(chips);
  const ex=EX[key];
  panel.append(h('div',{class:'exhead'}, h('span',{class:'exno'},ex.no), h('span',{class:'extitle'},ex.title), h('div',{class:'exdesc'},ex.desc)));
  if(ex.quiz&&!ex.locked) panel.append(h('div',{class:'lead'}, h('span',{},'📝'), h('span',{html:'<b>먼저 프린트에 직접 풀어요.</b> 내 답을 입력해야 실행 화면이 열려요.'})));
  if(ex.locked&&!G.unlocked[key]){
    panel.append(h('div',{class:'locked'}, h('b',{},'먼저 프린트에 직접 코드를 써 보세요!'), h('span',{class:'stepinfo'},'다 썼으면 아래 버튼을 눌러 정답 코드와 실행 과정을 확인해요.'), h('button',{class:'primary',onclick:()=>{G.unlocked[key]=true; showEx(sec,key);}},'정답 코드 보기')));
    return;
  }
  if(ASK[key]&&!G.unlocked[key]){ if(sims[sec]) sims[sec].stop(); panel.append(gateView(sec,key)); return; }
  if(ASK[key]) panel.append(resultView(sec,key));
  const root=h('div',{class:'panel'}); panel.append(root);
  if(sims[sec]) sims[sec].stop();
  sims[sec]=new Sim(root, ex, {key});
  if(flash){ root.classList.add('flash'); }
}
function buildTabs(){
  const nav=$('#tabs'), main=$('#main');
  SECTIONS.forEach(S=>{
    nav.append(h('a',{href:'#'+S.id, role:'tab', id:'tab-'+S.id, 'aria-controls':'panel-'+S.id}, S.name));
    main.append(h('section',{class:'panel', id:'panel-'+S.id, role:'tabpanel', hidden:true}));
  });
  // 예제 선택 메뉴
  const jm=$('#jmList');
  SECTIONS.forEach(S=>{
    jm.append(h('div',{class:'sec'},S.name));
    if(!S.exs) jm.append(h('button',{onclick:()=>{ $('#jump').open=false; location.hash=S.id; }}, h('b',{},'실험'), '들여쓰기 옮기기'));
    else S.exs.forEach(k=>jm.append(h('button',{onclick:()=>{ $('#jump').open=false; if(location.hash!=='#'+S.id) location.hash=S.id; showEx(S.id,k,true); }}, h('b',{},EX[k].no), EX[k].title)));
  });
}
function route(){
  const id=location.hash.slice(1);
  const S=SECTIONS.find(x=>x.id===id)||SECTIONS[0];
  SECTIONS.forEach(x=>{ $('#panel-'+x.id).hidden=x.id!==S.id; $('#tab-'+x.id).setAttribute('aria-selected',String(x.id===S.id)); if(x.id!==S.id&&sims[x.id]) sims[x.id].stop(); });
  const p=$('#panel-'+S.id);
  if(!p.childElementCount){ if(S.exs) showEx(S.id,G.cur[S.id]||S.exs[0]); else renderLab(p); }
}
document.addEventListener('keydown',e=>{ const id=(SECTIONS.find(x=>x.id===location.hash.slice(1))||SECTIONS[0]).id; const s=id==='indent'?LAB.sim:sims[id]; if(s) s.key(e); });
document.addEventListener('click',e=>{ const j=$('#jump'); if(j.open&&!j.contains(e.target)) j.open=false; });

/* 글자 크기 · 테마 */
let fs=17; try{ fs=+localStorage.getItem('wl-fs')||17; }catch(e){}
const applyFs=()=>{ document.documentElement.style.fontSize=fs+'px'; };
const saveFs=()=>{ try{ localStorage.setItem('wl-fs',fs); }catch(e){} };
$('#fsDown').onclick=()=>{ fs=Math.max(13,fs-1); saveFs(); applyFs(); };
$('#fsUp').onclick=()=>{ fs=Math.min(26,fs+1); saveFs(); applyFs(); };
const mq=window.matchMedia('(prefers-color-scheme: dark)');
const isDark=()=>{ const t=document.documentElement.dataset.theme; return t?t==='dark':mq.matches; };
const themeLabel=()=>{ $('#themeBtn').textContent=isDark()?'☀️ 라이트':'🌙 다크'; };
$('#themeBtn').onclick=()=>{ document.documentElement.dataset.theme=isDark()?'light':'dark'; try{ localStorage.setItem('wl-theme',document.documentElement.dataset.theme); }catch(e){} themeLabel(); };
let savedTheme=null; try{ savedTheme=localStorage.getItem('wl-theme'); }catch(e){} if(savedTheme) document.documentElement.dataset.theme=savedTheme;
mq.addEventListener?.('change',themeLabel);
applyFs(); themeLabel();
buildTabs(); route();
window.addEventListener('hashchange',route);
</script>
