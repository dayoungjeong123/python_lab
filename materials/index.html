<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>학습지 자료실</title>
<meta name="description" content="다영쌤의 파이썬 흐름 실험실 학습지 PDF 모음">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 헤더 / 학습지 목록(한 줄에 하나) / 펼치는 PDF 보기 */
:root{
  --bg:#EEF2F7; --panel:#FFFFFF; --ink:#152033; --muted:#5A6579; --line:#D6DDE8; --line-strong:#9AA6B8;
  --accent:#2F6FEB; --accent-ink:#FFFFFF; --accent-soft:#E3ECFD; --false:#D93A40;
  --font-d:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --font-b:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141D; --panel:#171E2A; --ink:#E6EAF2; --muted:#9AA5B8; --line:#2A3445; --line-strong:#56637A;
  --accent:#6E9DFF; --accent-ink:#0F141D; --accent-soft:#1F2C47; --false:#FF6B70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141D; --panel:#171E2A; --ink:#E6EAF2; --muted:#9AA5B8; --line:#2A3445; --line-strong:#56637A;
  --accent:#6E9DFF; --accent-ink:#0F141D; --accent-soft:#1F2C47; --false:#FF6B70; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;min-height:100vh}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.titlebox{display:flex;flex-direction:column;gap:4px}
.home{font-size:.9rem;font-weight:700;color:var(--muted);text-decoration:none;align-self:flex-start;border-radius:6px;padding:.1em .3em;margin-left:-.3em}
.home:hover{color:var(--accent);background:var(--accent-soft)}
h1{font-family:var(--font-d);font-weight:400;font-size:2.1rem;line-height:1.1;margin:0}
.lead{margin:0;color:var(--muted)}
.hctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.btn{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);padding:.42em .9em;text-decoration:none;display:inline-flex;align-items:center;gap:.35em;white-space:nowrap}
button:hover,.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
button:focus-visible,.btn:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-strong);border-radius:999px;padding:3px;background:var(--panel)}
.seg::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.seg[data-on="dark"]::before{transform:translateX(100%)}
.seg.ready::before{transition:transform .35s cubic-bezier(.65,0,.35,1),background-color .35s}
.seg button{position:relative;z-index:1;border:none;border-radius:999px;padding:.32em .85em;background:transparent;color:var(--muted);font-weight:500;transition:color .35s}
.seg button:hover{background:transparent;color:var(--ink)}
.seg button[aria-checked="true"]{color:var(--accent-ink);font-weight:700}
::view-transition-old(root),::view-transition-new(root){animation-duration:.35s}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:center;box-shadow:0 2px 8px rgba(20,30,50,.05)}
.item.open{border-color:var(--accent)}
.doc{width:3.2em;height:3.9em;border-radius:8px;background:linear-gradient(160deg,var(--accent-soft),var(--panel));border:2px solid var(--accent);display:grid;place-items:center;font-family:var(--font-d);font-size:1.05rem;color:var(--accent);position:relative}
.doc::after{content:"PDF";position:absolute;bottom:-.55em;left:50%;transform:translateX(-50%);font-family:var(--font-b);font-size:.6rem;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:0 .35em}
.info{min-width:0}
.info h2{font-family:var(--font-d);font-weight:400;font-size:1.35rem;line-height:1.2;margin:0}
.info .unit{font-size:.82rem;color:var(--muted);font-weight:700}
.info p{margin:.2em 0 0;font-size:.92rem;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.viewer{grid-column:1/-1;margin-top:8px;display:flex;flex-direction:column;gap:8px}
.viewer iframe{width:100%;height:min(80vh,1000px);border:1px solid var(--line);border-radius:12px;background:#fff}
.viewer .hint{font-size:.85rem;color:var(--muted);margin:0}
.empty{color:var(--muted)}
@media (max-width:680px){.item{grid-template-columns:auto minmax(0,1fr)}.acts{grid-column:1/-1;justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){.seg.ready::before,.seg button{transition:none}}
footer.credit{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;text-align:center;color:var(--muted);font-size:.92rem}
footer.credit b{color:var(--ink)}
</style>
<script src="../admin.js"></script></head><body>
<div class="wrap">
  <header class="top">
    <div class="titlebox"><a class="home" href="../index.html">← 실험실 목록</a><h1>📄 학습지 자료실</h1></div>
    <div class="hctl"><div class="seg" id="theme-seg" role="radiogroup" aria-label="화면 모드"><button role="radio" data-theme-set="light" aria-checked="false">☀️ 라이트</button><button role="radio" data-theme-set="dark" aria-checked="false">🌙 다크</button></div><span data-admin-slot></span></div>
  </header>
  <p class="lead">수업 시간에 쓴 학습지예요. <b>👀 바로 보기</b>로 열어 보거나 <b>⬇ 내려받기</b>로 저장할 수 있어요.</p>
  <ul class="list" id="list"><li class="empty">불러오는 중…</li></ul>
  <footer class="credit">© <b>JeongDayoung</b></footer>
</div>
<script>
// 학습지 목록은 list.json에서 읽어요. 새 학습지를 올리면 이 폴더에 PDF를 넣고 list.json에 한 줄 추가하면 돼요.
const FALLBACK=[
  {file:'(8)리스트와 중첩 제어구조.pdf',no:'(8)',title:'리스트와 중첩 제어구조',unit:'Ⅲ. 알고리즘과 프로그래밍',desc:'리스트 · 인덱스 · len · append · 슬라이싱, for 안에 if · while 안에 if · for 안에 for, 문제 1~4, (도전)문제 5',lab:'../for2/index.html'}
];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const safeFile=f=>typeof f==='string'&&/^[^\/\\]+\.pdf$/i.test(f)&&!f.startsWith('.')?f:null;
const url=f=>encodeURIComponent(f);
function render(items){
  const ok=items.filter(x=>safeFile(x.file));
  if(!ok.length){$('list').innerHTML='<li class="empty">아직 올라온 학습지가 없어요.</li>';return}
  $('list').innerHTML=ok.map((x,i)=>`<li class="item" id="doc-${i}">
    <div class="doc" aria-hidden="true">${esc(x.no||'')}</div>
    <div class="info"><span class="unit">${esc(x.unit||'')}</span><h2>${esc(x.no?x.no+' ':'')}${esc(x.title)}</h2>${x.desc?`<p>${esc(x.desc)}</p>`:''}</div>
    <div class="acts">
      <button type="button" class="btn primary" data-view="${i}" aria-expanded="false" aria-controls="viewer-${i}">👀 바로 보기</button>
      <a class="btn" href="${url(x.file)}" target="_blank" rel="noopener">↗ 새 창</a>
      <a class="btn" href="${url(x.file)}" download="${esc(x.file)}">⬇ 내려받기</a>
      ${x.lab?`<a class="btn" href="${esc(x.lab)}">🧪 실험실</a>`:''}
    </div>
    <div class="viewer" id="viewer-${i}" hidden></div>
  </li>`).join('');
  $('list').querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.view,x=ok[i],v=$('viewer-'+i),li=$('doc-'+i),open=v.hidden;
    v.hidden=!open;li.classList.toggle('open',open);b.setAttribute('aria-expanded',String(open));b.textContent=open?'✕ 닫기':'👀 바로 보기';
    if(open&&!v.firstChild){v.innerHTML=`<iframe src="${url(x.file)}#view=FitH" title="${esc(x.title)} 학습지"></iframe><p class="hint">휴대폰에서 잘 안 보이면 <b>↗ 새 창</b>이나 <b>⬇ 내려받기</b>를 눌러 주세요.</p>`}
    if(open)li.scrollIntoView({block:'start',behavior:'smooth'});
  }));
}
fetch('list.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(j=>render(Array.isArray(j)?j:FALLBACK)).catch(()=>render(FALLBACK));

const sysDark=()=>matchMedia('(prefers-color-scheme: dark)').matches;
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':sysDark()};
const paintTheme=()=>{const d=isDark();$('theme-seg').dataset.on=d?'dark':'light';document.querySelectorAll('[data-theme-set]').forEach(b=>b.setAttribute('aria-checked',String((b.dataset.themeSet==='dark')===d)))};
try{const t=localStorage.getItem('wl-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}
document.querySelectorAll('[data-theme-set]').forEach(b=>b.onclick=()=>{const t=b.dataset.themeSet;if((t==='dark')===isDark())return;
  try{localStorage.setItem('wl-theme',t)}catch(e){}$('theme-seg').dataset.on=t;b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-checked',String(x===b)));
  const apply=()=>{document.documentElement.dataset.theme=t};
  setTimeout(()=>{if(document.startViewTransition&&!matchMedia('(prefers-reduced-motion: reduce)').matches)document.startViewTransition(apply);else apply()},120)});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintTheme);
paintTheme();requestAnimationFrame(()=>requestAnimationFrame(()=>$('theme-seg').classList.add('ready')));
</script>
</body></html>
