<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>파이썬 흐름 실험실</title>
<meta name="description" content="고등학교 1학년 정보 수업용 파이썬 흐름 실험실: while문, 이중 for문, 리스트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: 실험실 고르기 — 제목 / 카드뉴스 3장(세로형) / 바닥글 */
:root{
  --bg:#EEF2F7; --panel:#FFFFFF; --ink:#152033; --muted:#5A6579; --line:#D6DDE8; --line-strong:#9AA6B8;
  --accent:#2F6FEB; --accent-ink:#FFFFFF; --accent-soft:#E3ECFD;
  --code-bg:#18202F; --code-fg:#E4E8F0; --t-kw:#8DB8FF; --t-num:#FFCC4D; --t-str:#A9D48C;
    --font-d:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --font-b:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-m:"JetBrains Mono",ui-monospace,Consolas,"D2Coding",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141D; --panel:#171E2A; --ink:#E6EAF2; --muted:#9AA5B8; --line:#2A3445; --line-strong:#56637A;
  --accent:#6E9DFF; --accent-ink:#0F141D; --accent-soft:#1F2C47; --code-bg:#0B1018; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141D; --panel:#171E2A; --ink:#E6EAF2; --muted:#9AA5B8; --line:#2A3445; --line-strong:#56637A;
  --accent:#6E9DFF; --accent-ink:#0F141D; --accent-soft:#1F2C47; --code-bg:#0B1018; color-scheme:dark}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);line-height:1.55}
.wrap{max-width:952px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:28px;min-height:100vh}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.kicker{font-size:.9rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
h1{font-family:var(--font-d);font-weight:400;font-size:clamp(2rem,6vw,2.8rem);line-height:1.1;margin:.15em 0 0;text-wrap:balance}
.lead{margin:.5em 0 0;color:var(--muted)}

/* 화면 모드 스위치 (while 실험실과 같은 모양) */
.seg{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-strong);border-radius:999px;padding:3px;background:var(--panel)}
.seg::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.seg[data-on="dark"]::before{transform:translateX(100%)}
.seg.ready::before{transition:transform .35s cubic-bezier(.65,0,.35,1),background-color .35s}
.seg button{position:relative;z-index:1;font:inherit;cursor:pointer;border:none;border-radius:999px;padding:.32em .85em;background:transparent;color:var(--muted);white-space:nowrap;font-weight:500;transition:color .35s}
.seg button:hover{color:var(--ink)}
.seg button[aria-checked="true"]{color:var(--accent-ink);font-weight:700}
.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
::view-transition-old(root),::view-transition-new(root){animation-duration:.35s}

/* 카드뉴스 */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;list-style:none;margin:0;padding:0}
@media (max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{--c:var(--accent);position:relative;display:flex;flex-direction:column;height:100%;border-radius:16px;overflow:hidden;text-decoration:none;color:var(--ink);
  background:linear-gradient(170deg,color-mix(in srgb,var(--c) 12%,var(--panel)) 0%,var(--panel) 70%);
  border:1px solid var(--line);box-shadow:0 2px 8px rgba(20,30,50,.06);transition:transform .25s,box-shadow .25s,border-color .25s}
a.card:hover{transform:translateY(-4px);box-shadow:0 10px 24px color-mix(in srgb,var(--c) 22%,transparent);border-color:var(--c)}
a.card:focus-visible{outline:4px solid var(--c);outline-offset:4px}
.card .top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0}
.no{font-family:var(--font-d);font-size:1rem;color:var(--c)}
.badge{font-size:.75rem;font-weight:700;border-radius:999px;padding:.2em .8em;background:var(--c);color:var(--panel)}
.badge.soon{background:var(--panel);color:var(--muted);border:1px solid var(--line-strong)}
.card .big{font-family:var(--font-d);font-size:1.9rem;line-height:1.1;padding:8px 16px 0;margin:0;font-weight:400}
.card .big code{font-family:var(--font-m);font-weight:700;color:var(--c);font-size:.82em}
.card .sub{padding:4px 16px 0;margin:0;font-size:.95rem;font-weight:500}
.snip{margin:12px 16px 0;margin-top:auto;background:var(--code-bg);color:var(--code-fg);border-radius:10px;padding:10px 12px;font-family:var(--font-m);font-size:.8rem;line-height:1.55;white-space:pre;overflow:hidden}
.snip .k{color:var(--t-kw);font-weight:700}.snip .n{color:var(--t-num)}.snip .s{color:var(--t-str)}
.tags{display:flex;flex-wrap:wrap;gap:5px;padding:10px 16px 12px;margin:0;list-style:none}
.tags li{font-size:.74rem;font-weight:500;border-radius:999px;padding:.15em .7em;background:color-mix(in srgb,var(--c) 14%,var(--panel));color:var(--ink)}
.go{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 14px;font-weight:700;font-size:.92rem;color:var(--c)}
.go .arr{display:inline-grid;place-items:center;width:1.9em;height:1.9em;border-radius:50%;background:var(--c);color:var(--panel);font-size:1rem;transition:transform .25s}
a.card:hover .go .arr{transform:translateX(4px)}
.card.locked{cursor:default}
.card.locked .snip,.card.locked .big,.card.locked .sub,.card.locked .tags{opacity:.6}
.card.locked .go{color:var(--muted)}
.card.locked .go .arr{background:var(--line);color:var(--muted)}
.card.locked .no{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.card,.go .arr,.seg.ready::before,.seg button{transition:none}a.card:hover{transform:none}}

footer.credit{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;text-align:center;color:var(--muted);font-size:.92rem}
footer.credit b{color:var(--ink)}
</style></head><body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="kicker">고등학교 1학년 정보 · 파이썬</div>
      <h1>파이썬 흐름 실험실</h1>
      <p class="lead">코드를 한 줄씩 실행하면서 변수와 흐름이 어떻게 바뀌는지 살펴봐요. 카드를 골라 들어가세요.</p>
    </div>
    <div class="seg" id="theme-seg" role="radiogroup" aria-label="화면 모드"><button role="radio" data-theme-set="light" aria-checked="false">☀️ 라이트</button><button role="radio" data-theme-set="dark" aria-checked="false">🌙 다크</button></div>
  </header>

  <ul class="cards" id="cards"></ul>

  <footer class="credit">© <b>JeongDayoung</b></footer>
</div>

<script>
// 실험실 목록: 새 실험실이 완성되면 href를 채우면 카드가 열려요.
const LABS=[
  {key:'while',no:'01',title:'<code>while</code>문',sub:'조건이 참인 동안 반복해요',href:'while/index.html',
   tags:['while 형식','for → while','break · continue','숫자 맞추기 게임'],
   code:'<span class="k">while</span> i &lt; <span class="n">5</span>:\n    print(<span class="s">"Hello"</span>)\n    i += <span class="n">1</span>'},
  {key:'for',no:'02',title:'이중 <code>for</code>문',sub:'반복 안에 또 반복이 있어요',href:'',
   tags:['바깥 반복 · 안쪽 반복','별 찍기','구구단 전체'],
   code:'<span class="k">for</span> i <span class="k">in</span> range(<span class="n">3</span>):\n    <span class="k">for</span> j <span class="k">in</span> range(<span class="n">3</span>):\n        print(i, j)'},
  {key:'list',no:'03',title:'리스트',sub:'여러 값을 한 줄로 담아요',href:'',
   tags:['인덱스','append','리스트와 for'],
   code:'a = [<span class="n">3</span>, <span class="n">1</span>, <span class="n">4</span>]\na.append(<span class="n">5</span>)\nprint(a[<span class="n">0</span>])'}
];
document.getElementById('cards').innerHTML=LABS.map(l=>{
  const open=!!l.href,tag=open?'a':'div';
  return `<li><${tag} class="card ${l.key}${open?'':' locked'}" ${open?`href="${l.href}"`:'aria-disabled="true"'}>
    <div class="top"><span class="no">${l.no}</span><span class="badge${open?'':' soon'}">${open?'열림':'준비 중'}</span></div>
    <h2 class="big">${l.title}</h2><p class="sub">${l.sub}</p>
    <ul class="tags">${l.tags.map(t=>`<li>${t}</li>`).join('')}</ul>
    <div class="snip" aria-hidden="true">${l.code}</div>
    <div class="go"><span>${open?'실험실 들어가기':'곧 열려요'}</span><span class="arr" aria-hidden="true">${open?'→':'🔒'}</span></div>
  </${tag}></li>`}).join('');

// 화면 모드: while 실험실과 같은 값을 함께 써요
const $=id=>document.getElementById(id);
const sysDark=()=>matchMedia('(prefers-color-scheme: dark)').matches;
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':sysDark()};
const paint=()=>{const d=isDark();$('theme-seg').dataset.on=d?'dark':'light';
  document.querySelectorAll('[data-theme-set]').forEach(b=>b.setAttribute('aria-checked',String((b.dataset.themeSet==='dark')===d)))};
try{const t=localStorage.getItem('wl-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}
document.querySelectorAll('[data-theme-set]').forEach(b=>b.onclick=()=>{const t=b.dataset.themeSet;if((t==='dark')===isDark())return;
  try{localStorage.setItem('wl-theme',t)}catch(e){}
  $('theme-seg').dataset.on=t;b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-checked',String(x===b)));
  const apply=()=>{document.documentElement.dataset.theme=t};
  setTimeout(()=>{if(document.startViewTransition&&!matchMedia('(prefers-reduced-motion: reduce)').matches)document.startViewTransition(apply);else apply()},120)});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paint);
paint();requestAnimationFrame(()=>requestAnimationFrame(()=>$('theme-seg').classList.add('ready')));
</script>
</body></html>
